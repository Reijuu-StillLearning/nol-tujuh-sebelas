<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday, Sayang 💖</title>
    <style>
      :root {
        --bg-1: #210124;
        --bg-2: #5f0f40;
        --bg-3: #9a031e;
        --accent: #ff85c0;
        --accent-2: #ffd166;
        --text: #fff8fc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        font-family: "Segoe UI", sans-serif;
        color: var(--text);
        background: linear-gradient(-45deg, var(--bg-1), var(--bg-2), var(--bg-3), #ff4d8d);
        background-size: 400% 400%;
        animation: gradientMove 12s ease infinite;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding: 2rem;
      }

      @keyframes gradientMove {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      .glow {
        position: absolute;
        width: 45vw;
        height: 45vw;
        max-width: 500px;
        max-height: 500px;
        background: radial-gradient(circle, rgba(255, 166, 201, 0.45), transparent 70%);
        filter: blur(12px);
        animation: pulse 5s ease-in-out infinite;
      }

      .glow.left {
        left: -12vw;
        top: -8vh;
      }

      .glow.bottom {
        right: 12vw;
        bottom: -15vh;
        animation-delay: -2.5s;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.75;
        }
        50% {
          transform: scale(1.2);
          opacity: 0.35;
        }
      }

      .card {
        position: relative;
        width: min(560px, 92vw);
        padding: 2rem;
        border-radius: 24px;
        backdrop-filter: blur(12px);
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.32);
        box-shadow: 0 12px 45px rgba(0, 0, 0, 0.35);
        animation: rise 0.9s ease-out;
        z-index: 2;
      }

      @keyframes rise {
        from {
          transform: translateY(18px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      h1 {
        margin-top: 0;
        margin-bottom: 0.4rem;
        font-size: clamp(1.9rem, 4vw, 2.6rem);
      }

      p {
        margin: 0.4rem 0 1.1rem;
        line-height: 1.6;
      }

      .heart-btn {
        border: none;
        border-radius: 999px;
        padding: 0.85rem 1.35rem;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #3d0a2f;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.22s ease, box-shadow 0.22s ease;
      }

      .heart-btn:hover {
        transform: translateY(-2px) scale(1.02);
        box-shadow: 0 8px 24px rgba(255, 188, 216, 0.45);
      }

      .message {
        margin-top: 1.2rem;
        min-height: 3.2rem;
        opacity: 0;
        transform: translateY(8px);
        transition: opacity 0.35s ease, transform 0.35s ease;
        font-size: 1.02rem;
      }

      .message.show {
        opacity: 1;
        transform: translateY(0);
      }

      .heart {
        position: absolute;
        bottom: -30px;
        font-size: clamp(1rem, 2.5vw, 1.6rem);
        animation: floatUp linear forwards;
        pointer-events: none;
        z-index: 1;
      }

      @keyframes floatUp {
        to {
          transform: translateY(-120vh) translateX(var(--drift));
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="glow left"></div>
    <div class="glow bottom"></div>

    <main class="card" aria-live="polite">
      <h1>🎂 Happy Birthday, Cintaku!</h1>
      <p>
        Semoga hari kamu seindah warna-warna ini. Terima kasih sudah hadir dan bikin semuanya
        jadi lebih hangat, lebih lucu, dan lebih bermakna.
      </p>
      <button class="heart-btn" id="surpriseBtn">Klik untuk kejutan romantis ✨</button>
      <div class="message" id="message"></div>
    </main>

    <script>
      const messages = [
        "Di setiap detik yang lewat, aku makin bersyukur bisa kenal kamu 💗",
        "Semoga semua doa baik kamu cepat dikabulkan, sayang 🌸",
        "Kamu adalah hadiah terindah di hidupku. Happy birthday! 🎁",
      ];

      const messageEl = document.getElementById("message");
      const btn = document.getElementById("surpriseBtn");
      let index = 0;

      function releaseHeart() {
        const heart = document.createElement("span");
        heart.className = "heart";
        heart.textContent = ["💖", "💘", "💕", "💞", "🌷"][Math.floor(Math.random() * 5)];
        heart.style.left = `${Math.random() * 100}%`;
        heart.style.setProperty("--drift", `${(Math.random() - 0.5) * 60}px`);
        heart.style.animationDuration = `${4 + Math.random() * 4}s`;
        heart.style.opacity = `${0.8 + Math.random() * 0.2}`;
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 8000);
      }

      btn.addEventListener("click", () => {
        messageEl.textContent = messages[index];
        messageEl.classList.add("show");
        index = (index + 1) % messages.length;

        for (let i = 0; i < 18; i += 1) {
          setTimeout(releaseHeart, i * 85);
        }
      });

      setInterval(releaseHeart, 1100);
    </script>
  </body>
</html>
